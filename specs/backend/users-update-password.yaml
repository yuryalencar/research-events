endpoint: PATCH /api/v1/users/me/password

description: >
  Allows any authenticated user to update their own password.
  Requires the current password for verification before accepting the new one.
  Contributor accounts currently cannot use this endpoint because contributors
  have no JWT (password_hash = NULL); they will be able to once the account-
  claim flow is implemented (future feature).

request:
  headers:
    Authorization: JWT in HTTP-only cookie (required)
  body:
    current_password: string (required)
    new_password: string (required)
    new_password_confirmation: string (required)

responses:
  200:
    description: Password updated successfully
    body:
      code: PASSWORD_UPDATED
      data:
        message: "Password updated successfully."

  400:
    description: Validation failure or wrong current password
    cases:
      - code: VALIDATION_ERROR
        trigger: any required field is missing or empty
        message: "current_password, new_password and new_password_confirmation are required"
      - code: VALIDATION_ERROR
        trigger: new_password and new_password_confirmation do not match
        message: "new_password and new_password_confirmation do not match"
      - code: VALIDATION_ERROR
        trigger: new_password does not satisfy complexity rules
        message: "password must be at least 8 characters and contain at least one uppercase letter, one lowercase letter, and one special character"
      - code: INVALID_CURRENT_PASSWORD
        trigger: current_password does not match the stored hash
        message: "current password is incorrect"

  401:
    description: No valid JWT present (missing, expired, or invalid token)
    body:
      code: TOKEN_MISSING | TOKEN_EXPIRED | TOKEN_INVALID
      error:
        message: "..."
    note: >
      Standard JWT middleware response — same as all other protected routes.

  429:
    description: Rate limit exceeded
    body:
      code: RATE_LIMIT_EXCEEDED
      error:
        message: "Too many requests. Please wait a moment and try again."

rules:
  - JWT authentication required — uses the existing JWT middleware
  - User ID is extracted from JWT claims; it is impossible to change another user's password via this endpoint
  - current_password verified against the user's stored bcrypt hash before any update is performed
  - new_password must satisfy ALL of the following:
      - minimum 8 characters
      - at least one uppercase letter (A–Z)
      - at least one lowercase letter (a–z)
      - at least one special character (any non-alphanumeric character)
  - new_password and new_password_confirmation must be identical (compared before hashing)
  - new_password hashed with bcrypt cost 12 before storing — same cost as the login flow
  - Changing to the same password as the current one is allowed (no explicit check)
  - Rate limit: 10 attempts per IP per minute (same as POST /api/v1/auth/login)
  - No AuditLog entry is written — AuditLog tracks event/deadline entities only, not user mutations

permissions:
  - Authenticated users only (admin, moderator)
  - Contributors are implicitly excluded until they can obtain a JWT (future account-claim flow)
  - A user can only change their own password — no role can change another user's password via this endpoint

border_cases:
  - Empty string for any field → 400 VALIDATION_ERROR (treated same as missing)
  - new_password ≠ new_password_confirmation → 400 VALIDATION_ERROR (checked before complexity and before DB lookup)
  - new_password fails complexity → 400 VALIDATION_ERROR (checked before DB lookup)
  - current_password correct but new_password invalid → 400 VALIDATION_ERROR (complexity checked first, DB lookup only if new password is valid)
  - current_password incorrect → 400 INVALID_CURRENT_PASSWORD
  - Malformed JSON body → 400 VALIDATION_ERROR
  - Rate limit hit with valid credentials → 429 regardless of whether the password would have been accepted
  - No JWT cookie → 401 TOKEN_MISSING (middleware rejects before handler runs)
  - Expired JWT → 401 TOKEN_EXPIRED (middleware rejects before handler runs)

definition_of_done:
  - [x] Returns 200 + PASSWORD_UPDATED on valid request with correct current password and valid new password
  - [x] Returns 400 VALIDATION_ERROR when any required field is missing or empty
  - [x] Returns 400 VALIDATION_ERROR when new_password and new_password_confirmation do not match
  - [x] Returns 400 VALIDATION_ERROR when new_password is shorter than 8 characters
  - [x] Returns 400 VALIDATION_ERROR when new_password has no uppercase letter
  - [x] Returns 400 VALIDATION_ERROR when new_password has no lowercase letter
  - [x] Returns 400 VALIDATION_ERROR when new_password has no special character
  - [x] Returns 400 INVALID_CURRENT_PASSWORD when current_password is wrong
  - [x] Returns 401 when request has no JWT cookie
  - [x] Returns 429 when rate limit is exceeded
  - [x] Password stored as bcrypt hash (cost 12) — never plaintext
  - [x] New password can be used to authenticate (login) immediately after update
  - [x] Rate limit is 10 attempts per IP per minute
  - [x] All border cases above have a corresponding test case
