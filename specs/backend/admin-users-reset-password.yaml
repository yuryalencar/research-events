endpoint: PATCH /api/v1/admin/users/{id}/password

description: >
  Admin resets any user's password. No current password required — admin
  authentication is the gate. Invalidates the target user's active session
  (clears tokens) so they must re-authenticate with the new password.

request:
  path:
    id: integer (required) — target user ID
  body:
    new_password: string (required)
    new_password_confirmation: string (required) — must match new_password

responses:
  200:
    description: Password updated and session invalidated
    body:
      code: USER_PASSWORD_CHANGED
      data:
        user:
          id: integer
          name: string
          email: string
          role: string
  400:
    description: Missing fields or passwords do not match
    body:
      code: VALIDATION_ERROR
      error:
        message: "new_password and new_password_confirmation are required"
  401:
    description: Not authenticated
  403:
    description: Caller does not have admin role
  404:
    description: User not found (or soft-deleted — same response, never reveals existence)
    body:
      code: USER_NOT_FOUND
      error:
        message: "user not found"
  422:
    description: Self-change attempt or password too weak
    body:
      code: CANNOT_CHANGE_OWN_PASSWORD | PASSWORD_TOO_WEAK
      error:
        message: "..."

rules:
  - Password hashed with bcrypt at cost 12
  - ClearTokens called on target user after update (same pattern as ChangeRole)
  - Admin cannot use this endpoint to reset their own password — 422 CANNOT_CHANGE_OWN_PASSWORD
    (they must use PATCH /api/v1/users/me/password instead)
  - Soft-deleted users return 404 — same as non-existent (GORM default scope excludes them from FindByID)
  - Password complexity: min 8 chars, at least one uppercase, one lowercase, one special character
    (same rules as ValidatePasswordComplexity used across all password endpoints)
  - Rate-limited: 10 requests/minute/IP (same limiter as login and other admin write endpoints)

permissions:
  - Admin role only (RequireRole("admin"))
  - JWT in HTTP-only cookie required

border_cases:
  - Passwords don't match → 400 VALIDATION_ERROR
  - new_password empty → 400 VALIDATION_ERROR
  - new_password_confirmation empty → 400 VALIDATION_ERROR
  - Password below complexity requirements → 422 PASSWORD_TOO_WEAK
  - Admin resets own password via this endpoint → 422 CANNOT_CHANGE_OWN_PASSWORD
  - Target id is a soft-deleted user → 404 USER_NOT_FOUND (GORM excludes soft-deleted from FindByID)
  - Target id does not exist → 404 USER_NOT_FOUND
  - Moderator calls this endpoint → 403 (enforced by RequireRole middleware)
  - Unauthenticated request → 401 (enforced by RequireAuth middleware)

definition_of_done:
  - 200 + password updated + target user tokens cleared on valid request
  - Target user forced to re-authenticate after reset
  - 400 when passwords don't match
  - 400 when either field is missing
  - 422 PASSWORD_TOO_WEAK when complexity not met
  - 422 CANNOT_CHANGE_OWN_PASSWORD when admin targets own account
  - 404 when user not found or soft-deleted (same response shape for both)
  - 403 when caller is not admin
  - 401 when unauthenticated
  - bcrypt cost verified in service tests
  - All border cases have a corresponding test
